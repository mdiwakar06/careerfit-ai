name: CareerFit AI CI & Playwright E2E Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-build-and-e2e:
    name: Typecheck, SDET Tests, Build & Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run SDET Automated Tests (PII, Parsers, Schema)
        run: npm run test:sdet

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: 1

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
